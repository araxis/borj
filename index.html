<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borj — Shahnameh Tower Defense</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23170f06'/%3E%3Cpath d='M16 52V24l6-5 5 5 5-5 5 5 5-5 6 5v28H16z' fill='%23d8a93e'/%3E%3Cpath d='M23 52V34h18v18' fill='%23311d08'/%3E%3Cpath d='M20 28h24v6H20z' fill='%237b4d13'/%3E%3C/svg%3E" />
  <link rel="preload" as="image" href="assets/ui/splash-bg.webp" fetchpriority="high" />
  <link rel="stylesheet" href="./src/ui/style.css" />
  <style>.splash-bg{background-image:linear-gradient(rgba(10,7,3,0.5),rgba(10,7,3,0.78)),url('assets/ui/splash-bg.webp');opacity:1}.overlay{background-image:linear-gradient(rgba(10,7,4,0.58),rgba(8,5,3,0.74)),url('assets/ui/splash-bg.webp')}</style>
  <script>
    // ?headless=1 — keep the render loop alive in hidden/background tabs so automated
    // verification (screenshot capture) can drive the game without a visible window.
    if (new URLSearchParams(location.search).has('headless')) {
      // Main-thread timers are throttled to ~1Hz in hidden tabs; a worker's are not.
      // Ping-pong clocking: the worker replies 33ms after each request, and the next
      // request is only sent AFTER the frame flush completes — slow frames self-pace
      // instead of piling worker messages onto a saturated main thread.
      const workerSrc = 'onmessage = () => setTimeout(() => postMessage(0), 33)';
      const pump = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })));
      let queue = new Map(); let nextId = 1;
      window.requestAnimationFrame = (cb) => { const id = nextId++; queue.set(id, cb); return id; };
      window.cancelAnimationFrame = (id) => { queue.delete(id); };
      pump.onmessage = () => {
        const cbs = queue; queue = new Map();
        const t = performance.now();
        cbs.forEach((cb) => { try { cb(t); } catch (e) { console.error(e); } });
        pump.postMessage(0);
      };
      pump.postMessage(0);
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui"></div>
  <div id="loading">
    <div class="splash-bg" aria-hidden="true"></div>
    <div class="splash">
      <div class="splash-sun">
        <div class="splash-rays"></div>
        <div class="splash-orb"></div>
      </div>
      <div class="splash-title">
        <span class="splash-fa">برج</span>
        <span class="splash-en">Shahnameh Tower Defense</span>
      </div>
      <div class="splash-bar"><i></i></div>
      <div class="splash-tip">Preparing the defense…</div>
    </div>
    <div class="splash-embers" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
